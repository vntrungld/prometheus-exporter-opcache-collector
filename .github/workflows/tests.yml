name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 6
          - php: '7.4'
            laravel: '6.*'
            testbench: '4.*'
            phpunit: '9.*'
          # Laravel 7
          - php: '7.4'
            laravel: '7.*'
            testbench: '5.*'
            phpunit: '9.*'
          # Laravel 8
          - php: '8.0'
            laravel: '8.*'
            testbench: '6.*'
            phpunit: '9.*'
          - php: '8.1'
            laravel: '8.*'
            testbench: '6.*'
            phpunit: '9.*'
          # Laravel 9
          - php: '8.0'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '9.*'
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '9.*'
          - php: '8.2'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '9.*'
          # Laravel 10
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'
          # Laravel 11
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '10.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '10.*'
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '11.*'
          # Laravel 12
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          # Laravel 13
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            phpunit: '12.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            phpunit: '12.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit
